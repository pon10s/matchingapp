<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <title>パスワード再発行 - Match Log</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kiwi+Maru:wght@300;400;500&family=Yomogi&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="dashboard.css">
    <!-- Supabase client library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabaseClient.js"></script>
  </head>
  <body>
    <div class="login-container">
      <section class="auth-card">
        <h2 class="auth-title">パスワード再発行</h2>
        <p style="font-size: 14px; color: #6b7280; margin-bottom: 24px; text-align: center;">登録済みのメールアドレスを入力してください。<br>再発行用のリンクを送信します。</p>
        <form id="reset-form" class="auth-form">
          <div class="form-group">
            <label class="form-label">メールアドレス</label>
            <input type="email" id="reset-email" class="form-input" required>
          </div>
          <button type="submit" class="primary-btn">送信</button>
        </form>
        <div class="auth-back">
          <a href="login.html" class="text-link" style="text-decoration: none;">← 戻る</a>
        </div>
      </section>
    </div>
      </section>
    </div>
    <script>
      document.getElementById('reset-form').addEventListener('submit', async function(e) {
        e.preventDefault();
        const email = document.getElementById('reset-email').value.trim();
        if (!email) return;
        // GitHub Pages のURLに合わせてリダイレクト先を設定
        // 実運用時にはこの値を環境に合わせて調整してください
        const redirectTo = 'https://pon10s.github.io/matchingapp/login.html';
        const { data, error } = await supabaseClient.auth.resetPasswordForEmail(email, { redirectTo });
        if (error) {
          alert(error.message);
        } else {
          alert('パスワード再発行メールを送信しました。受信トレイをご確認ください。');
          // フォームをリセット
          document.getElementById('reset-form').reset();
        }
      });
    </script>
  </body>
</html>
