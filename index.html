<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Match Log</title>
  <link rel="stylesheet" href="dashboard.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="supabaseClient.js"></script>
  <script defer src="index.js"></script>
</head>
<body>
  <div class="app-container">
    <!-- ヘッダー -->
    <header class="glass-header">
      <div class="header-left" style="cursor: pointer;" onclick="location.href='index.html'">
        <img src="icons/calendar_logo_colorful.svg" alt="logo" class="logo-icon">
        <span class="app-title">Match L<span style="color:#D4869C;">o</span><span style="color:#7BA7D1;">g</span></span>
      </div>
      <button class="pill-btn" onclick="logout()">ログアウト</button>
    </header>

    <!-- メインコンテンツ -->
    <main class="main-content">

      <!-- 活動サマリータイトル -->
      <h2 class="section-title" style="margin-bottom: 24px;">活動サマリー</h2>

      <!-- KPIカード -->
      <div class="kpi-grid">
        <div class="kpi-card" onclick="location.href='profiles.html'">
          <svg class="kpi-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="12" cy="7" r="4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <div class="kpi-value"><span id="profiles-count">--</span></div>
          <div class="kpi-label">登録相手</div>
        </div>
        <div class="kpi-card" onclick="location.href='events.html'">
          <svg class="kpi-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="3" y="4" width="18" height="18" rx="2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <line x1="3" y1="10" x2="21" y2="10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <line x1="8" y1="2" x2="8" y2="6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <line x1="16" y1="2" x2="16" y2="6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
          <div class="kpi-value"><span id="upcoming-count">--</span></div>
          <div class="kpi-label">今後の予定</div>
        </div>
        <div class="kpi-card" onclick="location.href='calendar.html'">
          <svg class="kpi-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <polyline points="12 6 12 12 16 14" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <div class="kpi-value"><span id="pending-count">--</span></div>
          <div class="kpi-label">更新待ち</div>
        </div>
      </div>

      <!-- まちあぷネキからのひとこと -->
      <section class="card advice-card">
        <div class="advice-content">
          <h2 class="advice-title">まちあぷネキからのひとこと</h2>
          <p class="advice-text" id="advice-content">
            読み込み中...
          </p>
        </div>
        <div class="neki-illustration">
          <img id="neki-img" src="icons/まちあぷネキ.png" alt="まちあぷネキ">
        </div>
      </section>

      <!-- 今週の予定 -->
      <section class="card schedule-card">
        <h2 class="card-title">
          <svg class="card-title-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" style="color: #A8C5E3;">
            <rect x="3" y="4" width="18" height="18" rx="2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <line x1="3" y1="10" x2="21" y2="10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <line x1="8" y1="2" x2="8" y2="6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <line x1="16" y1="2" x2="16" y2="6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
          今週の予定
        </h2>
        <div id="schedule-list" class="schedule-list">
          <div class="schedule-item">
            <div class="schedule-info">
              <div class="schedule-time">読み込み中...</div>
            </div>
          </div>
        </div>
      </section>

      <!-- 予定が終わったデート -->
      <section class="card">
        <h2 class="card-title">
          <svg class="card-title-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" style="color: #D4B5D3;">
            <path d="M17 3a2.83 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          予定が終わったデート
        </h2>
        <div id="pending-list" class="pending-list"></div>
      </section>
    </main>

    <!-- 下部固定ナビ -->
    <nav class="bottom-nav">
      <a href="index.html" class="nav-btn active">
        <img src="icons/home-new.svg" alt="ホーム" class="nav-icon-img">
        <span class="nav-label">ホーム</span>
      </a>
      <a href="profiles.html" class="nav-btn">
        <img src="icons/profiles-new.svg" alt="プロフィール" class="nav-icon-img">
        <span class="nav-label">プロフィール</span>
      </a>
      <a href="events.html" class="nav-btn">
        <img src="icons/calendar-new.svg" alt="デート登録" class="nav-icon-img">
        <span class="nav-label">デート登録</span>
      </a>
      <a href="calendar.html" class="nav-btn">
        <img src="icons/battle-new.svg" alt="戦歴" class="nav-icon-img">
        <span class="nav-label">戦歴</span>
      </a>
      <a href="analytics.html" class="nav-btn">
        <img src="icons/chart-new.svg" alt="分析" class="nav-icon-img">
        <span class="nav-label">分析</span>
      </a>
      <a href="account.html" class="nav-btn">
        <img src="icons/settings-new.svg" alt="設定" class="nav-icon-img">
        <span class="nav-label">設定</span>
      </a>
    </nav>
  </div>
  <script>
    // まちあぷネキ画像をランダムに表示
    const nekiImages = [
      'icons/まちあぷネキ1.PNG',
      'icons/まちあぷネキ2.PNG',
      'icons/まちあぷネキ3.PNG',
      'icons/まちあぷネキ4.PNG'
    ];
    const randomIndex = Math.floor(Math.random() * nekiImages.length);
    document.getElementById('neki-img').src = nekiImages[randomIndex];
  </script>
</body>
</html>
