<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <title>マッチングアプリ管理 - ホーム</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <!-- Supabase client library loaded via CDN【39645647059278†L150-L215】 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Initialize Supabase client and helpers -->
    <script src="supabaseClient.js"></script>
    <script defer src="index.js"></script>
  </head>
  <body>
    <header>
      <h1>マッチングアプリ管理</h1>
    </header>
    <nav class="main-nav">
      <a href="index.html" class="active">ホーム</a>
      <a href="profiles.html">プロフィール一覧</a>
      <a href="events.html">デート登録</a>
      <a href="calendar.html">戦歴</a>
      <a href="account.html">アカウント</a>
    </nav>
    <main>
      <!-- LINE連携アナウンス（未連携時のみ表示） -->
      <section id="line-notice" style="display:none; background-color:#fff3cd; border-left:4px solid #ffc107;">
        <p style="margin:0;">📱 <a href="account.html" style="color:#856404; font-weight:bold;">こちら</a>からLINE連携をしてください</p>
      </section>
      
      <!-- マチアプネキからのアドバイス -->
      <section id="ai-advice" style="background-color:#e8f5e9; border-left:4px solid #4caf50;">
        <h2 style="margin-top:0;">💡 マチアプネキからのアドバイス</h2>
        <p id="advice-content" style="color:#2e7d32;">アドバイスを読み込み中...</p>
      </section>
      
      <!-- 概要セクション: 登録数や予定数などの統計表示 -->
      <section class="stats">
        <h2>概要</h2>
        <div class="stats-cards">
          <div class="card">
            <h3>登録相手</h3>
            <p id="profiles-count">-- 人</p>
          </div>
          <div class="card">
            <h3>今後の予定</h3>
            <p id="upcoming-count">-- 件</p>
          </div>
          <div class="card">
            <h3>更新待ち</h3>
            <p id="pending-count">-- 件</p>
          </div>
        </div>
      </section>
      <!-- 統計グラフセクション -->
      <section>
        <h2>統計</h2>
        <div style="margin-bottom: 1rem;">
          <label>期間:
            <select id="period-filter">
              <option value="3months">直近3ヶ月</option>
              <option value="6months">6ヶ月</option>
              <option value="1year">1年</option>
              <option value="all">全期間</option>
            </select>
          </label>
        </div>
        <div class="chart-tabs">
          <button class="chart-tab active" data-chart="status">ステータス別</button>
          <button class="chart-tab" data-chart="monthly">月別推移</button>
          <button class="chart-tab" data-chart="app">アプリ別</button>
        </div>
        <div style="position: relative; height: 400px; margin-top: 1rem;">
          <canvas id="statsChart"></canvas>
        </div>
      </section>
      <!-- 更新が必要なイベントを表示 -->
      <section>
        <h2>更新が必要なイベント</h2>
        <ul id="pending-list" style="list-style: none; padding-left: 0;"></ul>
      </section>
      <!-- クイック操作セクションは不要になったため削除 -->
    </main>
    <!-- 右下に固定表示するログアウトボタン -->
    <a href="#" class="logout-bottom" onclick="logout()">ログアウト</a>
    <footer>
      <p>&copy;2026 マッチングアプリ管理</p>
    </footer>
  </body>
</html>
