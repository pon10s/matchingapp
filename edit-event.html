<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <title>デート編集 - Match Log</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="dashboard.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabaseClient.js"></script>
    <script defer src="edit-event.js"></script>
    <style>
      .form-group {
        margin-bottom: 14px;
      }
      .form-label {
        display: block;
        font-size: 13px;
        color: #6b7280;
        font-weight: 500;
        margin-bottom: 6px;
      }
      .form-input {
        width: 100%;
        height: 48px;
        padding: 0 14px;
        border-radius: 12px;
        border: 1.5px solid #e5e7eb;
        background: #ffffff;
        font-size: 15px;
        color: var(--color-text-main);
        font-family: inherit;
        transition: all 0.2s;
      }
      .form-input:focus {
        border-color: #a8c5e3;
        outline: none;
        box-shadow: 0 0 0 3px rgba(168, 197, 227, 0.15);
      }
      select.form-input {
        appearance: none;
        background-image: url("data:image/svg+xml,%3Csvg width='12' height='8' viewBox='0 0 12 8' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1.5L6 6.5L11 1.5' stroke='%239ca3af' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
        background-repeat: no-repeat;
        background-position: right 14px center;
        padding-right: 40px;
      }
      textarea.form-input {
        height: auto;
        padding: 12px 14px;
        resize: vertical;
        min-height: 80px;
      }
      .time-chips {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .time-chip {
        flex: 1;
        min-width: calc(50% - 4px);
        height: 44px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 999px;
        border: 1.5px solid #e5e7eb;
        background: #ffffff;
        color: var(--color-text-main);
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.2s;
        user-select: none;
      }
      .time-chip:hover {
        border-color: #a8c5e3;
        background: #f8fafc;
      }
      .time-chip.active {
        border-color: #a8c5e3;
        background: rgba(168, 197, 227, 0.2);
        color: #7BA7D1;
        font-weight: 600;
      }
      .cta-btn {
        width: 90%;
        max-width: 320px;
        height: 48px;
        border-radius: 24px;
        border: none;
        color: #fff;
        font-weight: 600;
        font-size: 16px;
        background: linear-gradient(135deg, #F3B6C6, #AFC8E8);
        cursor: pointer;
        transition: all 0.2s;
        box-shadow: 0 4px 12px rgba(175, 200, 232, 0.3);
        margin: 20px auto 0;
        display: block;
      }
      .cta-btn:hover {
        transform: translateY(-1px);
        box-shadow: 0 6px 16px rgba(175, 200, 232, 0.4);
      }
      .delete-link {
        text-align: center;
        margin-top: 16px;
        color: #9ca3af;
        font-size: 14px;
        cursor: pointer;
        transition: color 0.2s;
      }
      .delete-link:hover {
        color: #6b7280;
      }
    </style>
  </head>
  <body>
    <div class="app-container">
      <header class="glass-header">
        <div class="header-left" style="cursor: pointer;" id="backBtn">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6b7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 8px;">
            <path d="M19 12H5M12 19l-7-7 7-7"/>
          </svg>
          <span class="app-title" style="font-weight: 600; color: #4a5568;" id="backTitle">戦歴</span>
        </div>
        <button class="pill-btn" onclick="logout()">ログアウト</button>
      </header>

      <main class="main-content">
        <h2 class="section-title" style="margin-bottom: 24px;">デート編集</h2>
        
        <div class="card">
          <form id="edit-event-form">
            <input type="hidden" id="eventId" value="">
            <input type="hidden" id="eventTypeHidden" value="">
            
            <div class="form-group">
              <label class="form-label">相手</label>
              <select id="profileSelect" class="form-input" required></select>
            </div>
            
            <div class="form-group">
              <label class="form-label">日付</label>
              <input type="date" id="eventDate" class="form-input" required>
            </div>
            
            <div class="form-group">
              <label class="form-label">時間帯</label>
              <div class="time-chips">
                <div class="time-chip" data-value="morning">モーニング</div>
                <div class="time-chip" data-value="lunch">ランチ</div>
                <div class="time-chip" data-value="cafe">カフェ</div>
                <div class="time-chip" data-value="dinner">ディナー</div>
              </div>
            </div>
            
            <div class="form-group">
              <label class="form-label">感想</label>
              <textarea id="eventNote" class="form-input" placeholder="デートの感想を入力" rows="3"></textarea>
            </div>
          </form>
        </div>
        
        <button type="submit" form="edit-event-form" class="cta-btn">更新</button>
        <div class="delete-link" id="deleteBtn">削除</div>
      </main>

      <nav class="bottom-nav">
        <a href="index.html" class="nav-btn">
          <img src="icons/home-new.svg" alt="ホーム" class="nav-icon-img">
          <span class="nav-label">ホーム</span>
        </a>
        <a href="profiles.html" class="nav-btn">
          <img src="icons/profiles-new.svg" alt="プロフィール" class="nav-icon-img">
          <span class="nav-label">プロフィール</span>
        </a>
        <a href="events.html" class="nav-btn">
          <img src="icons/calendar-new.svg" alt="デート登録" class="nav-icon-img">
          <span class="nav-label">デート登録</span>
        </a>
        <a href="calendar.html" class="nav-btn active">
          <img src="icons/battle-new.svg" alt="戦歴" class="nav-icon-img">
          <span class="nav-label">戦歴</span>
        </a>
        <a href="analytics.html" class="nav-btn">
          <img src="icons/chart-new.svg" alt="分析" class="nav-icon-img">
          <span class="nav-label">分析</span>
        </a>
        <a href="account.html" class="nav-btn">
          <img src="icons/settings-new.svg" alt="設定" class="nav-icon-img">
          <span class="nav-label">設定</span>
        </a>
      </nav>
    </div>
  </body>
</html>
