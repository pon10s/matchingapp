<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <title>デート編集 - マッチングアプリ管理</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabaseClient.js"></script>
    <script defer src="edit-event.js"></script>
  </head>
  <body>
    <header>
      <h1>デート編集</h1>
    </header>
    <nav class="main-nav">
      <a href="index.html">ホーム</a>
      <a href="profiles.html">プロフィール一覧</a>
      <a href="events.html">デート登録</a>
      <a href="calendar.html" class="active">戦歴</a>
      <a href="account.html">アカウント</a>
    </nav>
    <main>
      <section>
        <form id="edit-event-form">
          <input type="hidden" id="eventId" value="">
          <label>相手:
            <select id="profileSelect"></select>
          </label>
          <label>日付:
            <input type="date" id="eventDate" required>
          </label>
          <label>感想:
            <textarea id="eventNote" placeholder="デートの感想を入力" rows="3"></textarea>
          </label>
          <button type="submit">更新</button>
          <button type="button" id="deleteBtn">削除</button>
          <button type="button" id="cancelBtn">キャンセル</button>
        </form>
      </section>
    </main>
    <a href="#" class="logout-bottom" onclick="logout()">ログアウト</a>
    <footer>
      <p>&copy;2026 マッチングアプリ管理</p>
    </footer>
  </body>
</html>
