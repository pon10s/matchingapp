<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <title>相手一覧 - Match Log</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="dashboard.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabaseClient.js"></script>
    <script defer src="profiles.js"></script>
  </head>
  <body>
    <div class="app-container">
      <header class="glass-header">
        <div class="header-left" style="cursor: pointer;" onclick="location.href='index.html'">
          <img src="icons/calendar_logo_colorful.svg" alt="logo" class="logo-icon">
          <span class="app-title">Match L<span style="color:#D4869C;">o</span><span style="color:#7BA7D1;">g</span></span>
        </div>
        <button class="pill-btn" onclick="logout()">ログアウト</button>
      </header>

      <main class="main-content">
        <div class="section-header">
          <h1 class="section-title">プロフィール一覧</h1>
          <button id="addNewBtn" class="add-btn">＋新規登録</button>
        </div>

        <!-- 検索カード -->
        <div class="card" id="searchCard" style="display:none;">
          <div style="margin-bottom:1rem;">
            <input type="text" id="searchInput" placeholder="名前またはどんな人で検索" style="width:100%; padding:0.5rem; border:1px solid rgba(120,150,190,0.18); border-radius:var(--radius-medium); background:rgba(255,255,255,0.6);">
          </div>

          <div class="filter-cards" style="margin-bottom:1rem;">
            <div class="filter-card" data-status="本命">
              <span>本命</span>
            </div>
            <div class="filter-card" data-status="あり">
              <span>あり</span>
            </div>
            <div class="filter-card" data-status="わからない">
              <span>わからない</span>
            </div>
            <div class="filter-card" data-status="ビミョウ">
              <span>ビミョウ</span>
            </div>
            <div class="filter-card" data-status="大人の関係">
              <span>大人の関係</span>
            </div>
            <div class="filter-card" data-status="友達">
              <span>友達</span>
            </div>
            <div class="filter-card" data-status="終了">
              <span>終了</span>
            </div>
          </div>

          <div style="display:flex; gap:0.5rem; justify-content:center;">
            <button type="button" id="applyFilter" class="search-btn">検索</button>
            <button type="button" id="clearFilter" class="clear-btn">クリア</button>
          </div>
        </div>

        <!-- 検索トグルボタン -->
        <button id="toggleSearch" style="position:fixed; bottom:90px; right:20px; width:56px; height:56px; border-radius:50%; background:var(--color-primary); border:none; box-shadow:0 4px 12px rgba(168,197,227,0.4); cursor:pointer; z-index:50; display:flex; align-items:center; justify-content:center; transition:all 0.2s;">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" style="color:white;">
            <circle cx="11" cy="11" r="8" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="m21 21-4.35-4.35" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>

        <!-- プロフィール一覧 -->
        <div id="profiles-list"></div>
      </main>

      <nav class="bottom-nav">
        <a href="index.html" class="nav-btn">
          <img src="icons/home-new.svg" alt="ホーム" class="nav-icon-img">
          <span class="nav-label">ホーム</span>
        </a>
        <a href="profiles.html" class="nav-btn active">
          <img src="icons/profiles-new.svg" alt="プロフィール" class="nav-icon-img">
          <span class="nav-label">プロフィール</span>
        </a>
        <a href="events.html" class="nav-btn">
          <img src="icons/calendar-new.svg" alt="デート登録" class="nav-icon-img">
          <span class="nav-label">デート登録</span>
        </a>
        <a href="calendar.html" class="nav-btn">
          <img src="icons/battle-new.svg" alt="戦歴" class="nav-icon-img">
          <span class="nav-label">戦歴</span>
        </a>
        <a href="analytics.html" class="nav-btn">
          <img src="icons/chart-new.svg" alt="分析" class="nav-icon-img">
          <span class="nav-label">分析</span>
        </a>
        <a href="account.html" class="nav-btn">
          <img src="icons/settings-new.svg" alt="設定" class="nav-icon-img">
          <span class="nav-label">設定</span>
        </a>
      </nav>
    </div>
  </body>
</html>
