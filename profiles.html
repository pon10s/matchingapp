<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <title>プロフィール一覧 - マッチングアプリ管理</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
    <!-- Supabase client library and initialization -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabaseClient.js"></script>
    <script defer src="profiles.js"></script>
  </head>
  <body>
    <header>
      <h1>プロフィール一覧</h1>
    </header>
    <nav class="main-nav">
      <a href="index.html">ホーム</a>
      <a href="profiles.html" class="active">プロフィール一覧</a>
      <a href="events.html">デート登録</a>
      <a href="calendar.html">戦歴</a>
      <a href="account.html">アカウント</a>
    </nav>
    <main>
      <section>
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem;">
          <h2 style="margin:0;">プロフィール一覧</h2>
          <button id="addNewBtn" class="new-profile-btn">＋新規登録</button>
        </div>
        <div class="search-group" style="margin-bottom:1rem;">
          <input type="text" id="searchInput" placeholder="名前またはどんな人で検索">
          <button type="button" id="searchBtn">検索</button>
        </div>
        <!-- 詳細フィルタ -->
        <details id="advanced-filter" style="margin-bottom:1rem;">
          <summary style="cursor:pointer; font-weight:bold;">詳細フィルタ</summary>
          <div style="padding:1rem; background:#f9f9f9; border-radius:8px; margin-top:0.5rem;">
            <label>ステータス:
              <div style="display:flex; flex-wrap:wrap; gap:0.5rem; margin-top:0.5rem;">
                <label style="display:flex; align-items:center; gap:0.2rem;">
                  <input type="checkbox" class="status-filter" value="本命"> 本命
                </label>
                <label style="display:flex; align-items:center; gap:0.2rem;">
                  <input type="checkbox" class="status-filter" value="あり"> あり
                </label>
                <label style="display:flex; align-items:center; gap:0.2rem;">
                  <input type="checkbox" class="status-filter" value="わからない"> わからない
                </label>
                <label style="display:flex; align-items:center; gap:0.2rem;">
                  <input type="checkbox" class="status-filter" value="ビミョウ"> ビミョウ
                </label>
                <label style="display:flex; align-items:center; gap:0.2rem;">
                  <input type="checkbox" class="status-filter" value="大人の関係"> 大人の関係
                </label>
                <label style="display:flex; align-items:center; gap:0.2rem;">
                  <input type="checkbox" class="status-filter" value="友達"> 友達
                </label>
                <label style="display:flex; align-items:center; gap:0.2rem;">
                  <input type="checkbox" class="status-filter" value="終了"> 終了
                </label>
              </div>
            </label>
            <div style="display:flex; gap:1rem; margin-top:1rem; flex-wrap:wrap;">
              <button type="button" id="applyFilter">適用</button>
              <button type="button" id="clearFilter" style="background:#ccc;">クリア</button>
            </div>
          </div>
        </details>
        <!-- テーブルヘッダーをなくし、ボディのみで表示 -->
        <table id="profiles-table">
          <tbody>
            <!-- Profiles will be rendered here -->
          </tbody>
        </table>
      </section>
    </main>
    <!-- 右下に固定表示するログアウトボタン -->
    <a href="#" class="logout-bottom" onclick="logout()">ログアウト</a>
    <footer>
      <p>&copy;2026 マッチングアプリ管理</p>
    </footer>
  </body>
</html>
