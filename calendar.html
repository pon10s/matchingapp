<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <title>戦歴 - Match Log</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="dashboard.css">
    <!-- Supabase client library and initialization -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabaseClient.js"></script>
    <script defer src="calendar.js"></script>
    <style>
      .year-label {
        font-size: 16px;
        font-weight: 700;
        color: var(--color-text-main);
        margin: 24px 0 12px 0;
      }
      .year-label:first-child {
        margin-top: 0;
      }
      .date-card {
        background: var(--color-card-bg);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border-radius: 20px;
        padding: 16px;
        box-shadow: var(--shadow-card);
        border: 1px solid rgba(255, 255, 255, 0.5);
        margin-bottom: 12px;
        cursor: pointer;
        transition: all 0.2s;
      }
      .date-card:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(100, 120, 160, 0.12);
      }
      .date-avatar {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        background: linear-gradient(135deg, var(--color-primary), var(--color-secondary));
        flex-shrink: 0;
        overflow: hidden;
      }
      .date-avatar img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .date-info {
        flex: 1;
        min-width: 0;
      }
      .date-name {
        font-size: 16px;
        font-weight: 600;
        color: var(--color-text-main);
        margin-bottom: 2px;
      }
      .date-left {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 12px;
      }
      .date-time {
        font-size: 16px;
        font-weight: 600;
        color: var(--color-text-main);
      }
      .time-tag {
        padding: 3px 8px;
        border-radius: 999px;
        background: rgba(210, 180, 160, 0.35);
        color: #8b7355;
        font-size: 11px;
        font-weight: 500;
      }
      .count-tag {
        padding: 4px 10px;
        border-radius: 999px;
        background: rgba(168, 197, 227, 0.25);
        color: #7BA7D1;
        font-size: 12px;
        font-weight: 500;
      }
      .date-right {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .date-comment {
        font-size: 13px;
        color: var(--color-text-main);
        line-height: 1.5;
        margin-top: 4px;
      }
      .count-tag {
        padding: 4px 10px;
        border-radius: 999px;
        background: rgba(168, 197, 227, 0.25);
        color: #7BA7D1;
        font-size: 12px;
        font-weight: 500;
        flex-shrink: 0;
      }
      .tab-container {
        display: flex;
        gap: 24px;
        justify-content: center;
        margin-bottom: 20px;
        border-bottom: 1px solid rgba(120, 150, 190, 0.15);
      }
      .tab-link {
        padding: 10px 0;
        font-size: 15px;
        font-weight: 500;
        color: var(--color-text-light);
        text-decoration: none;
        border-bottom: 2px solid transparent;
        transition: all 0.2s;
      }
      .tab-link.active {
        color: #7BA7D1;
        border-bottom-color: #7BA7D1;
      }
      .tab-link:hover {
        color: var(--color-text-main);
      }
    </style>
  </head>
  <body>
    <div class="app-container">
      <header class="glass-header">
        <div class="header-left" style="cursor: pointer;" onclick="location.href='index.html'">
          <img src="icons/calendar_logo_colorful.svg" alt="logo" class="logo-icon">
          <span class="app-title">Match L<span style="color:#D4869C;">o</span><span style="color:#7BA7D1;">g</span></span>
        </div>
        <button class="pill-btn" onclick="logout()">ログアウト</button>
      </header>

      <main class="main-content">
        <h2 class="section-title" style="margin-bottom: 24px;">戦歴</h2>
        
        <div class="tab-container">
          <a href="#" id="sortAscBtn" class="tab-link active">歴史を振り返る</a>
          <a href="#" id="sortDescBtn" class="tab-link">最近の予定をみる</a>
        </div>
        
        <div id="calendar-list"></div>
      </main>

      <nav class="bottom-nav">
        <a href="index.html" class="nav-btn">
          <img src="icons/home-new.svg" alt="ホーム" class="nav-icon-img">
          <span class="nav-label">ホーム</span>
        </a>
        <a href="profiles.html" class="nav-btn">
          <img src="icons/profiles-new.svg" alt="プロフィール" class="nav-icon-img">
          <span class="nav-label">プロフィール</span>
        </a>
        <a href="events.html" class="nav-btn">
          <img src="icons/calendar-new.svg" alt="デート登録" class="nav-icon-img">
          <span class="nav-label">デート登録</span>
        </a>
        <a href="calendar.html" class="nav-btn active">
          <img src="icons/battle-new.svg" alt="戦歴" class="nav-icon-img">
          <span class="nav-label">戦歴</span>
        </a>
        <a href="analytics.html" class="nav-btn">
          <img src="icons/chart-new.svg" alt="分析" class="nav-icon-img">
          <span class="nav-label">分析</span>
        </a>
        <a href="account.html" class="nav-btn">
          <img src="icons/settings-new.svg" alt="設定" class="nav-icon-img">
          <span class="nav-label">設定</span>
        </a>
      </nav>
    </div>
  </body>
</html>
