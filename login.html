<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <title>ログイン - Match Log</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kiwi+Maru:wght@300;400;500&family=Yomogi&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="dashboard.css">
    <!-- Supabase client library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabaseClient.js"></script>
    <script defer src="login.js"></script>
  </head>
  <body>
    <div class="login-container">
      <!-- 最初に表示する選択肢セクション -->
      <section id="auth-choice" class="auth-welcome">
        <!-- ロゴエリア -->
        <div class="logo-area">
          <svg class="logo-icon-large" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="3" y="4" width="18" height="18" rx="2" stroke="#A8C5E3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <line x1="3" y1="10" x2="21" y2="10" stroke="#A8C5E3" stroke-width="2" stroke-linecap="round"/>
            <line x1="8" y1="2" x2="8" y2="6" stroke="#A8C5E3" stroke-width="2" stroke-linecap="round"/>
            <line x1="16" y1="2" x2="16" y2="6" stroke="#A8C5E3" stroke-width="2" stroke-linecap="round"/>
            <circle cx="8" cy="14" r="1.5" fill="#E6A5B8"/>
            <circle cx="12" cy="14" r="1.5" fill="#E6A5B8"/>
            <circle cx="16" cy="14" r="1.5" fill="#E6A5B8"/>
            <circle cx="8" cy="18" r="1.5" fill="#D4B5D3"/>
            <circle cx="12" cy="18" r="1.5" fill="#D4B5D3"/>
          </svg>
          <h1 class="app-name">Match L<span style="color:#D4869C;">o</span><span style="color:#7BA7D1;">g</span></h1>
        </div>
        
        <!-- キャッチコピー -->
        <h2 class="catch-copy">
          <span class="large">大切</span><span class="small">な</span><span class="large">出会い</span><span class="small">を</span><span class="large">、</span><br>
          <span class="large pink">記録</span><span class="small">して</span><span class="large blue">育</span><span class="small">てよう</span>
        </h2>
        
        <!-- 3つの機能チップ -->
        <div class="feature-chips">
          <div class="chip">
            <svg class="chip-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z" stroke="#E6A5B8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <div class="chip-label">お相手</div>
          </div>
          <div class="chip">
            <svg class="chip-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <rect x="3" y="4" width="18" height="18" rx="2" stroke="#A8C5E3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              <line x1="3" y1="10" x2="21" y2="10" stroke="#A8C5E3" stroke-width="2" stroke-linecap="round"/>
              <line x1="8" y1="2" x2="8" y2="6" stroke="#A8C5E3" stroke-width="2" stroke-linecap="round"/>
              <line x1="16" y1="2" x2="16" y2="6" stroke="#A8C5E3" stroke-width="2" stroke-linecap="round"/>
            </svg>
            <div class="chip-label">デートの予定</div>
          </div>
          <div class="chip">
            <svg class="chip-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M17 3a2.83 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z" stroke="#D4B5D3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <div class="chip-label">記録</div>
          </div>
        </div>
        
        <p class="description" style="font-family: 'Kiwi Maru', 'Yomogi', 'Hiragino Maru Gothic Pro', cursive; color: #6b7280;">お相手やデートの予定・記録をまとめて管理</p>
        
        <!-- ボタン -->
        <div class="auth-buttons">
          <button id="show-register" class="auth-btn-new" style="background: rgba(123, 167, 209, 0.85); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: none; font-weight: 700; color: white; box-shadow: 0 4px 16px rgba(123, 167, 209, 0.3);">さっそくはじめる</button>
          <button id="show-login" class="auth-btn-new" style="background: rgba(255, 255, 255, 0.5); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: none; box-shadow: 0 4px 16px rgba(100, 120, 160, 0.15);">すでに登録済みのかたはこちら</button>
        </div>
      </section>

      <!-- パスワード再設定セクション -->
      <section id="reset-password-section" class="auth-card" style="display:none;">
        <h2 class="auth-title">パスワード再設定</h2>
        <form id="reset-password-form" class="auth-form">
          <div class="form-group">
            <label class="form-label">新しいパスワード</label>
            <input type="password" id="new-password-reset" class="form-input" required>
          </div>
          <div class="form-group">
            <label class="form-label">パスワード（確認）</label>
            <input type="password" id="new-password-reset-confirm" class="form-input" required>
          </div>
          <button type="submit" class="primary-btn">パスワードを変更</button>
        </form>
      </section>

      <!-- ログインフォームセクション -->
      <section id="login-section" class="auth-card" style="display:none;">
        <h2 class="auth-title">ログイン</h2>
        <form id="login-form" class="auth-form">
          <div class="form-group">
            <label class="form-label">メールアドレス</label>
            <input type="email" id="login-email" class="form-input" required>
          </div>
          <div class="form-group">
            <label class="form-label">パスワード</label>
            <input type="password" id="login-password" class="form-input" required>
          </div>
          <button type="submit" class="primary-btn">ログイン</button>
        </form>
        <div class="auth-links">
          <a href="reset.html" class="secondary-link">パスワードを忘れた方はこちら</a>
        </div>
        <div class="auth-back">
          <button type="button" id="back-to-choice-login" class="text-link">← 戻る</button>
        </div>
      </section>

      <!-- 新規登録フォームセクション -->
      <section id="register-section" class="auth-card" style="display:none;">
        <h2 class="auth-title">新規登録</h2>
        <form id="register-form" class="auth-form">
          <div class="form-group">
            <label class="form-label">ニックネーム</label>
            <input type="text" id="register-nickname" class="form-input" required placeholder="表示名">
          </div>
          <div class="form-group">
            <label class="form-label">メールアドレス</label>
            <input type="email" id="register-email" class="form-input" required>
          </div>
          <div class="form-group">
            <label class="form-label">パスワード</label>
            <input type="password" id="register-password" class="form-input" required>
          </div>
          <div class="form-group">
            <label class="form-label">パスワード（確認）</label>
            <input type="password" id="register-password-confirm" class="form-input" required>
          </div>
          <button type="submit" class="primary-btn">登録</button>
        </form>
        <div class="auth-back">
          <button type="button" id="back-to-choice-register" class="text-link">← 戻る</button>
        </div>
      </section>
    </div>
  </body>
</html>
