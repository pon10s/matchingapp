<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <title>登録完了 - Match Log</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="dashboard.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabaseClient.js"></script>
  </head>
  <body>
    <div class="app-container">
      <header class="glass-header">
        <div class="header-left" style="cursor: pointer;" onclick="location.href='index.html'">
          <img src="icons/calendar_logo_colorful.svg" alt="logo" class="logo-icon">
          <span class="app-title">Match L<span style="color:#D4869C;">o</span><span style="color:#7BA7D1;">g</span></span>
        </div>
        <button class="pill-btn" onclick="logout()">ログアウト</button>
      </header>

      <main class="main-content" style="display:flex; align-items:center; justify-content:center; min-height:60vh;">
        <div class="card" style="text-align:center; padding:40px 24px; width:100%;">
          <h2 style="font-size: 20px; font-weight: 600; color: var(--color-text-main); margin-bottom: 24px;">デート登録完了したンゴ～</h2>
          <div style="margin-bottom: 32px;">
            <img id="neki-img" src="" alt="まちあぷネキ" style="width: 180px; height: 180px; object-fit: contain; margin: 0 auto;">
          </div>
          <div style="display:flex; flex-direction:column; gap:12px;">
            <a href="calendar.html?sort=desc" style="width:100%; height:48px; border-radius:24px; border:none; color:#fff; font-weight:600; font-size:15px; background:linear-gradient(135deg, #F3B6C6, #AFC8E8); cursor:pointer; box-shadow:0 4px 12px rgba(175, 200, 232, 0.3); text-decoration:none; display:flex; align-items:center; justify-content:center;">予定を確認</a>
            <a href="index.html" style="color:#9DB0C6; text-decoration:none; padding:12px; font-size:14px;">ホームに戻る</a>
          </div>
        </div>
      </main>

      <nav class="bottom-nav">
        <a href="index.html" class="nav-btn">
          <img src="icons/home-new.svg" alt="ホーム" class="nav-icon-img">
          <span class="nav-label">ホーム</span>
        </a>
        <a href="profiles.html" class="nav-btn">
          <img src="icons/profiles-new.svg" alt="プロフィール" class="nav-icon-img">
          <span class="nav-label">プロフィール</span>
        </a>
        <a href="events.html" class="nav-btn active">
          <img src="icons/calendar-new.svg" alt="デート登録" class="nav-icon-img">
          <span class="nav-label">デート登録</span>
        </a>
        <a href="calendar.html" class="nav-btn">
          <img src="icons/battle-new.svg" alt="戦歴" class="nav-icon-img">
          <span class="nav-label">戦歴</span>
        </a>
        <a href="analytics.html" class="nav-btn">
          <img src="icons/chart-new.svg" alt="分析" class="nav-icon-img">
          <span class="nav-label">分析</span>
        </a>
        <a href="account.html" class="nav-btn">
          <img src="icons/settings-new.svg" alt="設定" class="nav-icon-img">
          <span class="nav-label">設定</span>
        </a>
      </nav>
    </div>
    <script>
      // まちあぷネキ画像をランダムに表示
      const nekiImages = [
        'icons/まちあぷネキ5.PNG',
        'icons/まちあぷネキ6.PNG',
        'icons/まちあぷネキ7.PNG',
        'icons/まちあぷネキ8.PNG'
      ];
      const randomIndex = Math.floor(Math.random() * nekiImages.length);
      document.getElementById('neki-img').src = nekiImages[randomIndex];
    </script>
  </body>
</html>
